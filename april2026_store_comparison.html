      sorted.map((x,i)=>{
        const prev = data===d.売上25 ? d.売上24 : data===d.利益25 ? d.利益24 : d.販管24;
        const prevV = prev[stores.indexOf(x.s)];
        const diff = x.v - prevV;
        const diffCls = (data===d.販管25) ? (diff<=0?'up':'down') : (diff>=0?'up':'down');
        const barW = Math.round(Math.abs(x.v)/max*90);
        const barC = x.v>=0 ? B25 : CORAL;
        return `<tr><td style="color:var(--color-text-secondary);font-size:11px;">${i+1}</td>
          <td style="font-weight:500;">${x.s}</td>
          <td style="text-align:right;">${fmt(x.v)}</td>
          <td><span class="${diffCls}">${fmtD(diff)}</span></td>
          <td><span class="bar-inline" style="width:${barW}px;background:${barC};"></span></td></tr>`;
      }).join('') + '</tbody>';
  }
  buildTable('rankSales', d.売上25, '売上高');
  buildTable('rankProfit', d.利益25, '営業利益');
  buildTable('rankSG', d.販管25, '販管費');
}

let sgChart=null, sgDiffChart=null;
function renderSG(store){
  const allKeys = Object.keys(sgItems25[store]);
  const keys = allKeys.filter(k=>sgItems25[store][k]>0||sgItems24[store][k]>0);
  const v25 = keys.map(k=>sgItems25[store][k]);
  const v24 = keys.map(k=>sgItems24[store][k]);
  const diffs = keys.map((k,i)=>v25[i]-v24[i]);
  const hW = Math.max(keys.length * 42 + 60, 320);

  document.getElementById('sgWrap').style.height = hW+'px';
  document.getElementById('sgDiffWrap').style.height = Math.max(keys.length*30+60,220)+'px';

  if(sgChart) sgChart.destroy();
  if(sgDiffChart) sgDiffChart.destroy();

  sgChart = new Chart(document.getElementById('sgChart'),{
    type:'bar',
    data:{labels:keys,datasets:[
      {label:'2025年度(4月)',data:v25,backgroundColor:B25,borderRadius:2,barPercentage:0.7},
      {label:'2024年度(4月)',data:v24,backgroundColor:B24,borderRadius:2,barPercentage:0.7}
    ]},
    options:{...baseOpts,indexAxis:'y',
      scales:{
        y:{ticks:{color:tc,font:{size:11}},grid:{color:gc}},
        x:{ticks:{color:tc,font:{size:10},callback:v=>v>=1000?v/1000+'千':v},grid:{color:gc}}
      },
      plugins:{legend:{display:true,position:'top',labels:{color:tc,font:{size:11},usePointStyle:true,pointStyle:'rect'}}}}
  });

  sgDiffChart = new Chart(document.getElementById('sgDiffChart'),{
    type:'bar',
    data:{labels:keys,datasets:[{label:'増減',data:diffs,backgroundColor:diffs.map(v=>v<=0?TEAL:CORAL),borderRadius:2,barPercentage:0.6}]},
    options:{...baseOpts,indexAxis:'y',
      scales:{
        y:{ticks:{color:tc,font:{size:11}},grid:{color:gc}},
        x:{ticks:{color:tc,font:{size:10},callback:v=>(v>=0?'+':'')+( v>=1000||v<=-1000?(v/1000).toFixed(0)+'千':v)},grid:{color:gc}}
      },
      plugins:{legend:{display:false}}}
  });
}

const views = ['overview','ranking','sg'];
function show(v){
  views.forEach(id=>document.getElementById('v-'+id).style.display=id===v?'':'none');
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',views[i]===v));
  if(v==='overview') initOverview();
  else if(v==='ranking') initRanking();
  else if(v==='sg') renderSG(document.getElementById('storeSelect').value);
}

initOverview();
</script>
