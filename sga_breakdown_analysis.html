const stores = Object.keys(raw);
let currentStore = '岡崎';
let mainChart = null;
let diffChart = null;

function getFilteredItems(store) {
  return items.filter(it => {
    const v = raw[store][it];
    return v && (v[0] > 0 || v[1] > 0);
  });
}

function renderCharts(store) {
  const filtered = getFilteredItems(store);
  const vals25 = filtered.map(it => raw[store][it][0]);
  const vals24 = filtered.map(it => raw[store][it][1]);
  const diffs = filtered.map(it => raw[store][it][0] - raw[store][it][1]);

  const shortLabels = filtered.map(l => l.replace('費','').replace('手当',''));

  const commonTick = { color: textColor, font: { size: 11 }, autoSkip: false, maxRotation: 40 };
  const commonGrid = { color: gridColor };

  if (mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: {
      labels: shortLabels,
      datasets: [
        { label: '2025年度', data: vals25, backgroundColor: BLUE25, borderRadius: 2, barPercentage: 0.7 },
        { label: '2024年度', data: vals24, backgroundColor: BLUE24, borderRadius: 2, barPercentage: 0.7 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: commonTick, grid: commonGrid },
        y: { ticks: { ...commonTick, callback: v => v >= 1000 ? (v/1000).toFixed(0)+'千' : v }, grid: commonGrid }
      }
    }
  });

  if (diffChart) diffChart.destroy();
  diffChart = new Chart(document.getElementById('diffChart'), {
    type: 'bar',
    data: {
      labels: shortLabels,
      datasets: [{
        label: '増減（千円）',
        data: diffs,
        backgroundColor: diffs.map(d => d <= 0 ? TEAL : CORAL),
        borderRadius: 2,
        barPercentage: 0.6
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: commonTick, grid: commonGrid },
        y: { ticks: { ...commonTick, callback: v => (v >= 0 ? '+' : '') + (v >= 1000 || v <= -1000 ? (v/1000).toFixed(0)+'千' : v) }, grid: commonGrid }
      }
    }
  });
}

const tabsEl = document.getElementById('storeTabs');
stores.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (s === currentStore ? ' active' : '');
  btn.textContent = s;
  btn.onclick = () => {
    currentStore = s;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderCharts(s);
  };
  tabsEl.appendChild(btn);
});

renderCharts(currentStore);
